workflows:
  ios-release:
    name: CanvasFlow iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.faressaref.canvasflow
      xcode: latest
    scripts:
      - name: Select signing profiles
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "ios/CanvasFlow.xcodeproj" \
            --scheme "CanvasFlow"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
