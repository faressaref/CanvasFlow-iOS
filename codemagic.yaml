workflows:
  ios-release:
    name: CanvasFlow iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.canvasflow.app
      vars:
        XCODE_PROJECT: "ios/CanvasFlow.xcodeproj"
        XCODE_SCHEME: "CanvasFlow"
      xcode: latest
    scripts:
      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Build and archive
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/CanvasFlow.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$CM_DEVELOPMENT_TEAM"
    artifacts:
      - build/CanvasFlow.xcarchive/**/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - "$CM_EMAIL"
        notify:
          success: true
          failure: true
