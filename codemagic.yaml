workflows:
  ios-release:
    name: CanvasFlow iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned IPA
        script: |
          set -e
          rm -rf build
          xcodebuild -project "ios/CanvasFlow.xcodeproj" \
            -scheme "CanvasFlow" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/CanvasFlow.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          mkdir -p build/ios/ipa/Payload
          cp -R build/CanvasFlow.xcarchive/Products/Applications/CanvasFlow.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry CanvasFlow-unsigned.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
