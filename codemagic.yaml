workflows:
  ios-native:
    name: CanvasFlow iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Clean build folder
        script: |
          rm -rf "$CM_BUILD_DIR/build"
          mkdir -p "$CM_BUILD_DIR/build"

      - name: Archive CanvasFlow
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/CanvasFlowIOS.xcodeproj" \
            -scheme "CanvasFlowIOS" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/CanvasFlowIOS.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Create IPA
        script: |
          APP_PATH="$CM_BUILD_DIR/build/CanvasFlowIOS.xcarchive/Products/Applications/CanvasFlowIOS.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: CanvasFlowIOS.app was not found inside the archive."
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/Payload"
          rm -f "$CM_BUILD_DIR/CanvasFlowIOS.ipa"

          mkdir "$CM_BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/Payload/"

          cd "$CM_BUILD_DIR"
          zip -qry "CanvasFlowIOS.ipa" "Payload"

          echo "===== IPA CREATED ====="
          ls -lh "$CM_BUILD_DIR/CanvasFlowIOS.ipa"

    artifacts:
      - CanvasFlowIOS.ipa
      - build/CanvasFlowIOS.xcarchive
