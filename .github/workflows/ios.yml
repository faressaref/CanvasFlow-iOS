name: Build CanvasFlow IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build CanvasFlow iOS
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS App
        run: |
          xcodebuild \
            -project CanvasFlowIOS.xcodeproj \
            -scheme CanvasFlowIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          rm -rf Payload CanvasFlowIOS-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CanvasFlowIOS.app Payload/
          zip -r CanvasFlowIOS-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CanvasFlow-IPA
          path: CanvasFlowIOS-unsigned.ipa
