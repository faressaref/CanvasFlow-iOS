name: Repair AI study sheet

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Apply AI study sheet repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch study sheet renderer
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('aiModel.value = localStorage.getItem("canvasflow-ai-model") || "gemini-2.5-flash";',
                        'aiModel.value = localStorage.getItem("canvasflow-ai-model") || "gemini-3.6-flash";')

          start = s.find('function cleanAIText(text) {')
          end = s.find('\n}\n\nfunction setAIResult', start)
          if start != -1 and end != -1:
              new_clean = '''function cleanAIText(text) {
  let out = String(text || "");
  out = out.replace(/```(?:text|markdown|md)?/gi, "").replace(/```/g, "");
  out = out.replace(/\\\\(rightarrow|to|Rightarrow|Longrightarrow)/g, "→");
  out = out.replace(/\\\\text\{([^}]*)\}/g, "$1");
  out = out.replace(/\\\\frac\{([^}]*)\}\{([^}]*)\}/g, "$1/$2");
  out = out.replace(/\\$\\$/g, "");
  out = out.replace(/\\$([^$\\n]+)\\$/g, "$1");
  out = out.replace(/\*\*([^*]+)\*\*/g, "$1").replace(/__([^_]+)__/g, "$1");
  out = out.replace(/^\s{0,3}#{1,6}\s+/gm, "");
  out = out.replace(/\\r/g, "");
  out = out.replace(/[ \t]+\n/g, "\n");
  out = out.replace(/\n{3,}/g, "\n\n");
  return out.trim();
}'''
              s = s[:start] + new_clean + s[end+2:]

          start = s.find('function addStudyTextToBoard(text) {')
          end = s.find('\n}\n\n// AI action buttons:', start)
          if start != -1 and end != -1:
              new_fn = r'''function addStudyTextToBoard(text) {
  const raw = cleanAIText(text);
  const paragraphs = raw.split(/\n{2,}/).map(x => x.trim()).filter(Boolean);

  const W = 900;
  const padX = 58;
  const topPad = 34;
  const bottomPad = 46;
  const bodyMaxW = W - padX * 2;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const titleFont = '700 29px Arial, "Noto Sans Arabic", sans-serif';
  const headingFont = '700 21px Arial, "Noto Sans Arabic", sans-serif';
  const bodyFont = '17px Arial, "Noto Sans Arabic", sans-serif';
  const lineH = 29;
  const headingH = 34;

  const measure = document.createElement('canvas').getContext('2d');
  const rows = [];
  for (const paragraph of paragraphs) {
    const normalized = paragraph
      .replace(/\\(rightarrow|to|Rightarrow|Longrightarrow)/g, '→')
      .replace(/\*\*/g, '')
      .replace(/^[-*]\s+/g, '• ')
      .replace(/^#{1,3}\s+/, '')
      .trim();
    if (!normalized) continue;

    const isHeading = /^(?:[📘💡🎯⚠️✅📝📌🧠🗂️🧩📅]|(?:Section|Chapter|Part)\b|\d+[.)]\s)/u.test(normalized) || normalized.length < 75;
    measure.font = isHeading ? headingFont : bodyFont;
    const words = normalized.split(/\s+/).filter(Boolean);
    const lines = [];
    let line = '';
    for (const word of words) {
      const candidate = line ? line + ' ' + word : word;
      if (measure.measureText(candidate).width > bodyMaxW && line) {
        lines.push(line);
        line = word;
      } else line = candidate;
    }
    if (line) lines.push(line);
    rows.push({ type: isHeading ? 'heading' : 'body', lines });
  }

  let H = topPad + 70;
  for (const row of rows) H += row.type === 'heading' ? row.lines.length * headingH + 18 : row.lines.length * lineH + 14;
  H += bottomPad;
  H = Math.max(360, Math.min(H, 5000));

  const c = document.createElement('canvas');
  c.width = W * dpr; c.height = H * dpr;
  c.style.width = W + 'px'; c.style.height = H + 'px';
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.textBaseline = 'top';
  ctx.direction = 'rtl';
  ctx.textAlign = 'right';

  // Calm paper background with soft colored section bands.
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#dce2ea'; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);
  ctx.fillStyle = '#eef4ff'; ctx.fillRect(1, 1, W - 2, 84);
  ctx.fillStyle = '#173b70'; ctx.font = titleFont;
  ctx.fillText('✦ CanvasFlow — مذكرة مذاكرة', W - padX, 27);
  ctx.strokeStyle = '#d9e4f4'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padX, 85); ctx.lineTo(W-padX, 85); ctx.stroke();

  let y = 108;
  let section = 0;
  for (const row of rows) {
    const heading = row.type === 'heading';
    if (heading) {
      const bands = ['#eef7ff','#eefaf4','#fff5e9','#f5efff','#fff0f5','#eef5ff'];
      ctx.fillStyle = bands[section % bands.length];
      const bandH = Math.max(42, row.lines.length * headingH + 12);
      ctx.beginPath();
      const x = 28, bw = W - 56, r = 12;
      ctx.roundRect(x, y - 6, bw, bandH, r); ctx.fill();
      ctx.fillStyle = '#24364b'; ctx.font = headingFont;
      for (const line of row.lines) { ctx.fillText(line, W - padX, y); y += headingH; }
      y += 12; section++;
    } else {
      ctx.fillStyle = '#303945'; ctx.font = bodyFont;
      for (const line of row.lines) { ctx.fillText(line, W - padX, y); y += lineH; }
      y += 14;
    }
  }

  const src = c.toDataURL('image/png');
  const left = Math.max(70, canvas.getCenter().left - W / 2);
  const top = Math.max(60, canvas.getCenter().top - Math.min(380, H / 2));
  fabric.Image.fromURL(src, img => {
    img.set({ left, top, objectRole:'studyNote', selectable:true, evented:true, cornerStyle:'circle', transparentCorners:false });
    canvas.add(img); canvas.setActiveObject(img); canvas.requestRenderAll(); scheduleSave(true);
    aiStatus.textContent = 'المذكرة اتحطت على البورد ✓';
    aiPanel.classList.remove('open');
    if (aiToggle) aiToggle.classList.remove('active');
  }, {crossOrigin:'anonymous'});
}'''
              s = s[:start] + new_fn + s[end+2:]

          # Ensure the AI result area itself never visually breaks words/letters.
          marker = '.ai-result {'
          if marker in s:
              st = s.find(marker); en = s.find('}', st)
              block = s[st:en]
              for prop in ['direction:rtl','text-align:right','word-break:normal','overflow-wrap:break-word','unicode-bidi:plaintext']:
                  if prop not in block: block += '; ' + prop
              s = s[:st] + block + s[en:]

          p.write_text(s, encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git rm .github/workflows/repair-ai-study-sheet.yml
          git commit -m "Apply AI study sheet repair [skip ci]"
          git push
